; Raises PHP's upload limits for local development with `php artisan serve`.
;
; The built-in dev server ignores `-d` flags passed to the outer `artisan
; serve` command — Laravel's ServeCommand spawns it as a fresh `php -S ...`
; process that doesn't inherit them. The only override Laravel actually
; forwards to that child process is the Herd-specific env var below, so
; this file only takes effect via that mechanism (see serve-mobile.sh).
upload_max_filesize = 150M
post_max_size = 150M
